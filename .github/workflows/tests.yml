name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: ./vendor/bin/pint --test

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Migrate and seed demo data
        run: |
          touch database/database.sqlite
          php artisan migrate --seed --force

  databases:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
          - db: pgsql
            port: 5432
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ledgerly_test
          MYSQL_USER: ledgerly
          MYSQL_PASSWORD: ledgerly
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerly_test
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U ledgerly" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: ledgerly_test
      DB_USERNAME: ledgerly
      DB_PASSWORD: ledgerly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # DB_* come from the job env and take precedence over phpunit.xml's SQLite defaults.
      - name: Run tests
        run: php artisan test

      - name: Migrate and seed demo data
        run: php artisan migrate:fresh --seed --force

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build -t ledgerly-api .

      - name: Boot image against Postgres and hit /up
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=ledgerly -e POSTGRES_PASSWORD=ledgerly -e POSTGRES_DB=ledgerly postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U ledgerly && break; sleep 1; done
          docker run -d --name api --network ci -p 8080:8080 \
            -e APP_KEY_SECRET=ci-secret -e DB_URL=postgresql://ledgerly:ledgerly@db:5432/ledgerly \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-password-123 ledgerly-api
          for i in $(seq 1 30); do curl -fsS localhost:8080/up && break; sleep 2; done
          curl -fsS -X POST localhost:8080/api/v1/auth/login -H 'Accept: application/json' \
            -d email=ci@example.com -d password=ci-password-123 | grep -q '"success":true'

      - name: Container logs
        if: always()
        run: docker logs api || true
