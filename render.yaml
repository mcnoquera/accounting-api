# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the API (Docker) and its Postgres database. Deploys on every push to main.
services:
  - type: web
    name: ledgerly-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_KEY_SECRET
        generateValue: true
      - key: APP_URL
        value: https://ledgerly-api.onrender.com
      - key: DB_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # "true" loads the demo company and demo users (password "password") on first boot.
      # Only for a throwaway demo: anyone who finds the URL can sign in with them.
      - key: SEED_DEMO_DATA
        value: "false"

databases:
  - name: ledgerly-db
    plan: free
    databaseName: ledgerly
    user: ledgerly
